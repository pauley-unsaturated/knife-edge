name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm validate:balance
      - name: Verify retained causal mechanic checkpoints
        run: pnpm exec tsx experiments/0004-raid-heat/keepers/v4/verify.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-lab-smoke-reports-and-replays
          path: experiments/0004-raid-heat/out/ci-lab-8/
          retention-days: 7
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:browser
