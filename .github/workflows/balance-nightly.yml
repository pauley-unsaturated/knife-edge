name: balance-nightly
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 2'
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:balance 40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance-reports-and-replays
          path: experiments/0004-raid-heat/out/ci-lab-40/
          retention-days: 14
